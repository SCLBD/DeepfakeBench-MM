model_name: AVFF-Pretrain-Adv
model_config:
  backbone:
    audio:
      name: AudioMAE
      version: mae_vit_base_patch16
      weight: pretrained/audiomae/pretrained.pth
    video:
      name: MARLIN
      version: marlin_vit_base
      weight: pretrained/marlin/marlin_vit_base_ytf.full.pt
  losses:
    - name: Lc
      func: avff_contrastive
      weight: 0.01
    - name: Lrec
      func: mse
      weight: 1
    - name: LadvG
      func: wasserstein_generator
      weight: 0.1
    - name: LadvD
      func: wasserstein_discriminator
      weight: 1

data_type: audio_video_real
data_config:
  frame_size: 224
  frame_mean: [ 0.485, 0.456, 0.406 ]
  frame_std: [ 0.229, 0.224, 0.225 ]
  num_frames: 16
  stride: 5
  remove_dc_offset: true
  spectrogram_type: Log-Mel
  spectrogram_backend: kaldi
  spectrogram_params:
    htk_compat: true
    use_energy: false
    window_type: hanning
    num_mel_bins: 128
    dither: 0.0
    frame_shift: 4.0
    frame_length: 16.0
  audio_mean: -4.2677393
  audio_std: 9.1379948  # 4.5689974 * 2
num_workers: 8

train_type: alternative
aug_config: default
train_datasets: [Mega-MMDF]
train_batch_size: 16
train_stages:
  - name: generator
    update_step: 1
    optimizer:
      type: AdamW
      params:
        lr: 0.00015
    scheduler: null
  - name: discriminator
    update_step: 1
    optimizer:
      type: AdamW
      params:
        lr: 0.001
num_epochs: 80
