# Test only; copy of the vanilla Mega-MMDF model and preprocessing settings.
# Real-only, within-clip audio window rotation. shift: 0 gives aligned baseline.
model_name: FRADE
model_config:
  losses:
  - name: CE
    func: cross_entropy
    params:
      real_num: 59644
      fake_num: 703936
  - name: CMC
    func: frade_cmc
    weight: 0.3
    params:
      real_num: 59644
      fake_num: 703936
  - name: CC
    func: frade_cc
    weight: 0.4
data_config:
  frame_size: 224
  frame_mean:
  - 0.485
  - 0.456
  - 0.406
  frame_std:
  - 0.229
  - 0.224
  - 0.225
  num_frames: 16
  stride: 1
  spectrogram_type: Log-Mel
  spectrogram_backend: librosa
  spectrogram_params:
    n_fft: 320
    hop_length: 160
    n_mels: 80
  misalignment:
    modality: audio
    shift: 1
num_workers: 8
val_batch_size: 16
data_type: audio_video_misaligned_real
