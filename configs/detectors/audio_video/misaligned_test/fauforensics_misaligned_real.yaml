# Test only; copy of the vanilla Mega-MMDF model and preprocessing settings.
# Real-only, within-clip audio window rotation. shift: 0 gives aligned baseline.
model_name: FauForensics
model_config:
  losses:
  - name: CE_AV
    func: cross_entropy
    weight: 0.8
    params:
      real_num: 59644
      fake_num: 703936
  - name: CE_A
    func: cross_entropy
    weight: 0.1
    params:
      real_num: 231641
      fake_num: 531939
  - name: CE_V
    func: cross_entropy
    weight: 0.1
    params:
      real_num: 107997
      fake_num: 655583
data_config:
  frame_size: 112
  frame_mean:
  - 0.485
  - 0.456
  - 0.406
  frame_std:
  - 0.229
  - 0.224
  - 0.225
  num_frames: 25
  stride: 1
  spectrogram_type: Log-Mel
  spectrogram_backend: torchaudio
  spectrogram_params:
    n_fft: 512
    n_mels: 80
    win_length: 320
    hop_length: 160
    top_db: 80
  audio_mean: -40
  audio_std: 40
  misalignment:
    modality: audio
    shift: 1
num_workers: 8
val_batch_size: 64
data_type: audio_video_misaligned_real
