model_name: FRADE
model_config:
  losses:
    - name: CE
      func: cross_entropy
      params:
        real_num: 59644
        fake_num: 21484
    - name: CMC
      func: frade_cmc
      weight: 0.3
      params:
        real_num: 59644
        fake_num: 21484
    - name: CC
      func: frade_cc
      weight: 0.4

data_type: audio_video
data_config:
  frame_size: 224
  frame_mean: [ 0.485, 0.456, 0.406 ]
  frame_std: [ 0.229, 0.224, 0.225 ]
  num_frames: 16
  stride: 1
  spectrogram_type: Log-Mel
  spectrogram_backend: librosa
  spectrogram_params:
    n_fft: 320
    hop_length: 160
    n_mels: 80
num_workers: 8

train_type: basic
aug_config: default
train_datasets: [Mega-MMDF-pipeline18]
train_batch_size: 16
val_datasets: [Mega-MMDF-pipeline18]
val_batch_size: 16
metric_scoring: sample-level AUC
val_per_epoch: 1
optimizer:
  type: AdamW
  params:
    lr: 0.00001
num_epochs: 5
