# Model Settings
model_name: MCL
model_config:
  audio_ckpt: pretrained/Cnn14_mAP=0.431.pth
  stage1_ckpt: pretrained/MCL/MCL_pretrained_on_Mega-MMDF.pth
  losses:
    - name: L_nce
      func: mcl_nce
    - name: L_jsd
      func: mcl_jsd
    - name: L_av
      func: cross_entropy
      params:
        real_num: 59644
        fake_num: 703936
    - name: L_v    
      func: cross_entropy
      weight: 2
      params:
        real_num: 107997
        fake_num: 655583
    - name: L_a
      func: cross_entropy
      weight: 1
      params:
        real_num: 231641
        fake_num: 531939


# Data Settings
data_type: audio_video
data_config:
  frame_size: 224
  frame_mean: [ 0.485, 0.456, 0.406 ]
  frame_std: [ 0.229, 0.224, 0.225 ]
  num_frames: 30
  stride: 1
  audio_sampling_rate: 32000
num_workers: 8

# Trainer Settings
train_type: basic
aug_config: default
train_datasets: [Mega-MMDF-20%]
train_batch_size: 32
val_datasets: [FakeAVCeleb, LAV-DF, PolyGlotFake, IDForge, Mega-MMDF-20%]
val_batch_size: 32
metric_scoring: sample-level AUC
val_per_epoch: 1
optimizer:
  type: Adam
  params:
    lr: 0.0002
    weight_decay: 0.0005
scheduler: null
num_epochs: 5

