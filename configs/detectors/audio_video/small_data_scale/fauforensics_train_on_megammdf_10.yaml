model_name: FauForensics
model_config:
  losses:
    - name: CE_AV
      func: cross_entropy
      weight: 0.8
      params:
        real_num: 59644
        fake_num: 703936
    - name: CE_A
      func: cross_entropy
      weight: 0.1
      params:
        real_num: 231641
        fake_num: 531939
    - name: CE_V
      func: cross_entropy
      weight: 0.1
      params:
        real_num: 107997
        fake_num: 655583

data_type: audio_video
data_config:
  frame_size: 112
  frame_mean: [ 0.485, 0.456, 0.406 ]
  frame_std: [ 0.229, 0.224, 0.225 ]
  num_frames: 25
  stride: 1
  spectrogram_type: Log-Mel
  spectrogram_backend: torchaudio
  spectrogram_params:
    n_fft: 512
    n_mels: 80
    win_length: 320
    hop_length: 160
    top_db: 80
  audio_mean: -40
  audio_std: 40
num_workers: 8


train_type: basic
aug_config: default
train_datasets: [Mega-MMDF-10%]
train_batch_size: 64
val_datasets: [FakeAVCeleb, LAV-DF, PolyGlotFake, IDForge, Mega-MMDF-10%]
val_batch_size: 64
metric_scoring: sample-level AUC
val_per_epoch: 1
optimizer:
  type: AdamP
  params:
    lr: 0.0005
    weight_decay: 0.0001
    betas: [0.9, 0.999]
scheduler:
  type: FauForensics_Customized
  interval: step
  params:
    power: 0.9
    lr_decay: 0.001
num_epochs: 10

