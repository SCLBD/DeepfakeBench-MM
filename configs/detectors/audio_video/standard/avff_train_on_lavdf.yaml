model_name: AVFF
model_config:
  pretrained: pretrained/avff/epoch100_step2020.pth
  backbone:
    audio:
      name: AudioMAE
      version: mae_vit_base_patch16
      weight: pretrained/audiomae/pretrained.pth
    video:
      name: MARLIN
      version: marlin_vit_base
      weight: pretrained/marlin/marlin_vit_base_ytf.full.pt
  losses:
    - name: CE
      func: cross_entropy
      params:
        real_num: 48214
        fake_num: 99611

data_type: audio_video
data_config:
  frame_size: 224
  frame_mean: [ 0.485, 0.456, 0.406 ]
  frame_std: [ 0.229, 0.224, 0.225 ]
  num_frames: 16
  stride: 5
  remove_dc_offset: true
  spectrogram_type: Log-Mel
  spectrogram_backend: kaldi
  spectrogram_params:
    htk_compat: true
    use_energy: false
    window_type: hanning
    num_mel_bins: 128
    dither: 0.0
    frame_shift: 4.0
    frame_length: 16.0
  audio_mean: -4.2677393
  audio_std: 9.1379948  # 4.5689974 * 2
num_workers: 8

train_type: basic
aug_config: default
train_datasets: [LAV-DF]
train_batch_size: 16
val_datasets: [FakeAVCeleb, LAV-DF, PolyGlotFake, IDForge, Mega-MMDF]
val_batch_size: 16
metric_scoring: sample-level AUC
val_every_epoch: 1
optimizer:
  type: AdamW
  params:
    lr: 0.0001
num_epochs: 20
